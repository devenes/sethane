<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Burpees">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">FULL BODY · METCON</text>
  
      <line x1="45" y1="245" x2="355" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Bottom plank phase -->
      <g opacity="0.45" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="195" cy="175" r="11" />
        <line x1="182" y1="180" x2="80" y2="225" />
        <line x1="176" y1="184" x2="180" y2="240" />
      </g>
      <!-- Explosive vertical jump phase -->
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="275" cy="68" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="7"/>
        <line x1="275" y1="83" x2="275" y2="145" />
        <!-- Arms reaching skyward -->
        <line x1="275" y1="98" x2="250" y2="38" />
        <line x1="275" y1="98" x2="300" y2="38" />
        <!-- Airborne legs -->
        <line x1="275" y1="145" x2="258" y2="212" />
        <line x1="275" y1="145" x2="292" y2="212" />
      </g>
      <path d="M275 238 L275 218" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4 4"/>
    
</svg>
