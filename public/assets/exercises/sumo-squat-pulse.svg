<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Sumo Squat Pulses">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">WIDE STANCE · TIME UNDER TENSION</text>
  
      <line x1="50" y1="245" x2="350" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="200" cy="92" r="15" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="200" y1="108" x2="200" y2="174" />
        <!-- Wide sumo legs -->
        <path d="M200 174 L142 182 L138 240" />
        <path d="M200 174 L258 182 L262 240" />
        <!-- Clasped hands at chest -->
        <path d="M200 124 L178 148 L200 144 L222 148 Z" stroke="#06b6d4" stroke-width="7" />
      </g>
      <!-- Pulse arrows -->
      <path d="M295 162 L295 196" stroke="#f59e0b" stroke-width="4" />
      <polygon points="295,155 289,165 301,165" fill="#f59e0b"/>
      <polygon points="295,203 289,193 301,193" fill="#f59e0b"/>
    
</svg>
