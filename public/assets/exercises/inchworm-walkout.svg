<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Inchworm Walkout">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">MOBILITY · FULL BODY WALKOUT</text>
  
      <line x1="50" y1="240" x2="350" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Mid-walkout pike pose -->
      <g opacity="0.4" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M95 235 L145 135 L205 235" />
      </g>
      <!-- Extended walkout plank -->
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="292" cy="142" r="13" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="276" y1="148" x2="95" y2="225" />
        <line x1="262" y1="154" x2="266" y2="236" />
      </g>
      <path d="M195 225 L252 225" stroke="#f59e0b" stroke-width="4" stroke-dasharray="5 4"/>
      <polygon points="258,225 248,219 248,231" fill="#f59e0b"/>
    
</svg>
