<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Reverse Lunge Knee Drive">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">UNILATERAL · POWER</text>
  
      <line x1="50" y1="245" x2="350" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Ghost reverse lunge -->
      <g opacity="0.3" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="150" cy="105" r="12" />
        <line x1="150" y1="118" x2="150" y2="175" />
        <path d="M150 175 L185 178 L185 240" />
        <path d="M150 175 L120 225 L90 228" />
      </g>
      <!-- Active knee drive -->
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="240" cy="78" r="14" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="240" y1="93" x2="240" y2="162" />
        <!-- Standing leg -->
        <line x1="240" y1="162" x2="240" y2="240" />
        <!-- High driven knee -->
        <path d="M240 162 L288 142 L282 192" stroke="#f59e0b" />
        <!-- Sprinter arms -->
        <path d="M240 110 L212 138 L225 112" />
        <path d="M240 110 L268 88" />
      </g>
      <path d="M135 215 Q205 180 272 142" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4"/>
    
</svg>
