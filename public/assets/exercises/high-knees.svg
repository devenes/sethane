<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="High Knees Sprint">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">HIGH CADENCE · CARDIO</text>
  
      <line x1="60" y1="245" x2="340" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="195" cy="72" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="7"/>
        <line x1="195" y1="88" x2="195" y2="158" />
        <!-- Support leg on ball of foot -->
        <line x1="195" y1="158" x2="185" y2="238" />
        <!-- High knee at 90 deg -->
        <path d="M195 158 L252 152 L248 204" stroke="#10b981" />
        <!-- Pumping arms -->
        <path d="M195 104 L165 132 L182 108" />
        <path d="M195 104 L228 128 L242 98" />
      </g>
      <line x1="140" y1="152" x2="280" y2="152" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5 5"/>
    
</svg>
