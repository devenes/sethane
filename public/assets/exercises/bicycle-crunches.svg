<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Bicycle Crunches">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">OBLIQUES · CORE ROTATION</text>
  
      <line x1="50" y1="235" x2="350" y2="235" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="118" cy="162" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="7"/>
        <!-- Curled torso -->
        <path d="M130 172 Q155 210 188 222" />
        <!-- Bent knee coming in -->
        <path d="M188 222 L175 162 L218 175" stroke="#10b981" />
        <!-- Extended pedaling leg -->
        <line x1="188" y1="222" x2="295" y2="182" />
        <!-- Elbow to knee -->
        <path d="M128 170 L168 162" stroke="#f59e0b" />
      </g>
    
</svg>
