<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Push-Ups">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">UPPER BODY · PUSH</text>
  
      <line x1="50" y1="240" x2="350" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Ghost top plank -->
      <g opacity="0.3" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none">
        <circle cx="290" cy="128" r="12" />
        <line x1="275" y1="134" x2="90" y2="232" />
        <line x1="260" y1="142" x2="260" y2="235" />
      </g>
      <!-- Bottom push-up position -->
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="295" cy="182" r="14" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="278" y1="186" x2="90" y2="232" />
        <!-- Bent elbow arm -->
        <path d="M258 190 L232 162 L258 236" stroke="#f59e0b" />
      </g>
      <path d="M318 195 L318 135" stroke="#10b981" stroke-width="4" stroke-dasharray="4 4"/>
      <polygon points="318,128 312,138 324,138" fill="#10b981"/>
    
</svg>
