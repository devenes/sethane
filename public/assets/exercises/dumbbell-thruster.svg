<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Dumbbell Thruster">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">COMPOUND · SQUAT + PRESS</text>
  
      <!-- Floor line -->
      <line x1="60" y1="245" x2="340" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- Ghost squat pose -->
      <g opacity="0.35" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="155" cy="115" r="14" />
        <path d="M155 130 L145 180 L180 185 L185 240" />
        <path d="M145 180 L118 190 L122 240" />
        <path d="M152 142 L175 130" />
      </g>
      <!-- Active overhead press pose -->
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="235" cy="82" r="15" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <!-- Torso -->
        <line x1="235" y1="98" x2="235" y2="168" />
        <!-- Legs -->
        <path d="M235 168 L215 240" />
        <path d="M235 168 L255 240" />
        <!-- Arms pressing overhead -->
        <path d="M235 112 L205 78 L205 42" />
        <path d="M235 112 L265 78 L265 42" />
      </g>
      <!-- Dumbbells overhead -->
      <g fill="#f59e0b">
        <rect x="188" y="34" width="34" height="10" rx="4" />
        <rect x="248" y="34" width="34" height="10" rx="4" />
      </g>
      <!-- Motion arrow -->
      <path d="M155 90 Q190 50 220 55" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4"/>
      <polygon points="224,55 214,49 215,61" fill="#10b981"/>
    
</svg>
