<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Dumbbell Renegade Row">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">ANTI-ROTATION · BACK & CORE</text>
  
      <line x1="50" y1="240" x2="350" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="290" cy="132" r="14" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="274" y1="138" x2="90" y2="225" />
        <!-- Support arm on hex dumbbell -->
        <line x1="258" y1="146" x2="258" y2="228" />
        <!-- Rowing arm pulling dumbbell to hip -->
        <path d="M250 148 L220 118 L228 168" stroke="#f59e0b" />
      </g>
      <rect x="244" y="228" width="28" height="10" rx="3" fill="#f59e0b" />
      <rect x="214" y="164" width="28" height="10" rx="3" fill="#f59e0b" />
    
</svg>
