<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Plank Shoulder Taps">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CORE STABILITY · ANTI-SWAY</text>
  
      <line x1="50" y1="240" x2="350" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="288" cy="130" r="14" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="272" y1="136" x2="90" y2="225" />
        <!-- Supporting arm -->
        <line x1="255" y1="145" x2="255" y2="236" />
        <!-- Tapping hand reaching to opposite shoulder -->
        <path d="M245 150 L218 182 L262 138" stroke="#f59e0b" />
      </g>
      <circle cx="262" cy="138" r="9" fill="none" stroke="#f59e0b" stroke-width="3" />
    
</svg>
