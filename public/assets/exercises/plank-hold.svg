<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Forearm Plank Hold">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">ISOMETRIC CORE</text>
  
      <line x1="50" y1="240" x2="350" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="292" cy="168" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="7"/>
        <!-- Rigid body line -->
        <line x1="275" y1="172" x2="90" y2="215" />
        <!-- Feet on mat -->
        <line x1="90" y1="215" x2="85" y2="236" />
        <!-- Forearm on mat -->
        <path d="M256 176 L256 234 L292 234" stroke="#10b981" />
      </g>
      <!-- Core tension glow -->
      <ellipse cx="190" cy="195" rx="38" ry="12" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" transform="rotate(-13 190 195)"/>
    
</svg>
