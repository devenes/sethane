<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Glute Bridges">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">LOW IMPACT · POSTERIOR</text>
  
      <line x1="50" y1="235" x2="350" y2="235" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Head on mat -->
        <circle cx="95" cy="216" r="13" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <!-- Diagonal shoulder-hip-knee bridge -->
        <line x1="115" y1="224" x2="205" y2="165" />
        <line x1="205" y1="165" x2="255" y2="142" />
        <!-- Shin down to planted heel -->
        <line x1="255" y1="142" x2="265" y2="228" />
        <!-- Arm flat on mat -->
        <line x1="125" y1="226" x2="215" y2="228" stroke="#06b6d4" />
      </g>
      <path d="M205 215 L205 178" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4 4"/>
      <polygon points="205,172 199,182 211,182" fill="#f59e0b"/>
    
</svg>
