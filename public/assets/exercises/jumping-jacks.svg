<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Jumping Jacks">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CARDIO · WARMUP & HIIT</text>
  
      <line x1="60" y1="245" x2="340" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="200" cy="76" r="15" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <line x1="200" y1="92" x2="200" y2="162" />
        <!-- Wide legs -->
        <line x1="200" y1="162" x2="152" y2="238" />
        <line x1="200" y1="162" x2="248" y2="238" />
        <!-- Overhead sweeping arms -->
        <path d="M200 108 L152 62 L182 36" />
        <path d="M200 108 L248 62 L218 36" />
      </g>
      <!-- Arcs -->
      <path d="M135 125 Q125 75 165 42" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="5 4"/>
      <path d="M265 125 Q275 75 235 42" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="5 4"/>
    
</svg>
