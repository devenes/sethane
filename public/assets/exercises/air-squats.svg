<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Bodyweight Squats">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>
  <rect width="400" height="280" rx="24" fill="url(#bg)" />
  <rect width="400" height="280" rx="24" fill="url(#grid)" />
  <rect x="16" y="14" width="180" height="22" rx="11" fill="#0f172a" opacity="0.8" />
  <text x="26" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">LOWER BODY · FOUNDATION</text>
  
      <line x1="60" y1="245" x2="340" y2="245" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <g stroke="url(#grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="205" cy="95" r="15" fill="#0f172a" stroke="#10b981" stroke-width="7"/>
        <!-- Upright torso -->
        <line x1="200" y1="112" x2="172" y2="178" />
        <!-- Parallel thigh + shin -->
        <path d="M172 178 L228 178 L222 240" />
        <path d="M172 178 L212 184 L205 240" opacity="0.55" />
        <!-- Arms extended forward -->
        <line x1="194" y1="126" x2="268" y2="126" stroke="#06b6d4" />
      </g>
      <!-- Depth guide line -->
      <line x1="140" y1="178" x2="260" y2="178" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>
    
</svg>
